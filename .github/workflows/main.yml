          fun Wallpaper(scrim: Float) {
              val t = rememberInfiniteTransition(label = "sea")
              val bob by t.animateFloat(0f, 1f, infiniteRepeatable(tween(5000, easing = FastOutSlowInEasing), RepeatMode.Reverse), label = "bob")
              Canvas(Modifier.fillMaxSize()) {
                  val w = size.width; val h = size.height
                  drawRect(Brush.verticalGradient(listOf(Color(0xFFF2B66B), Color(0xFFE48A52), Color(0xFF6D5A78),
                      Color(0xFF25506B), Color(0xFF123347), Color(0xFF0A1F2C))))
                  val c = Offset(w / 2, h * .32f)
                  drawCircle(Brush.radialGradient(listOf(Color(0xFFFFF3C9), Color(0xFFF7C36D), Color.Transparent), c, w * .3f), w * .3f, c)
                  val isl = Path().apply {
                      moveTo(0f, h * .72f); lineTo(0f, h * .66f)
                      quadraticBezierTo(w * .15f, h * .60f, w * .28f, h * .65f)
                      quadraticBezierTo(w * .40f, h * .58f, w * .55f, h * .65f)
                      quadraticBezierTo(w * .75f, h * .60f, w, h * .66f)
                      lineTo(w, h * .72f); close()
                  }
                  drawPath(isl, Color(0xFF0B2230))
                  val s = w * .42f; val dark = Color(0xFF07141C)
                  translate(w * .29f, h * .635f + bob * 10f) {
                      rotate(bob * 1.6f - .8f, Offset(s / 2f, 0f)) {
                          drawPath(Path().apply { moveTo(0f, 0f); quadraticBezierTo(s / 2f, s * .22f, s, 0f); lineTo(s * .92f, s * .08f)
                              quadraticBezierTo(s / 2f, s * .26f, s * .08f, s * .08f); close() }, dark)
                          drawPath(Path().apply { moveTo(0f, 0f); quadraticBezierTo(-s * .04f, -s * .14f, s * .05f, -s * .2f)
                              quadraticBezierTo(s * .03f, -s * .08f, s * .1f, 0f); close() }, dark)
                          drawPath(Path().apply { moveTo(s, 0f); quadraticBezierTo(s * 1.04f, -s * .14f, s * .95f, -s * .2f)
                              quadraticBezierTo(s * .97f, -s * .08f, s * .9f, 0f); close() }, dark)
                          drawRect(dark, Offset(s / 2f - 2f, -s * .46f), Size(4f, s * .5f))
                          drawPath(Path().apply { moveTo(s / 2f + 2f, -s * .44f); lineTo(s * .82f, -s * .34f)
                              lineTo(s * .78f, -s * .04f); lineTo(s / 2f + 2f, -s * .02f); close() }, Color(0xFFA8372F))
                      }
                  }
                  drawRect(Brush.verticalGradient(listOf(Color.Transparent, Color(0xFF06121A)), startY = h * .7f))
                  drawRect(Color(0xFF050D12).copy(alpha = .88f * scrim))
              }
          }

          @Composable
          fun Home(apps: List<AppItem>, dock: List<AppItem>, open: (AppItem) -> Unit) {
              val now by produceState(Date()) { while (true) { value = Date(); delay(10_000) } }
              val serif = FontFamily.Serif
              Column(Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding().padding(horizontal = 20.dp, vertical = 16.dp)) {
                  Column(Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {
                      BasicText(SimpleDateFormat("HH:mm", Locale.getDefault()).format(now),
                          style = TextStyle(color = Cream, fontSize = 72.sp, fontFamily = serif, fontWeight = FontWeight.Light, letterSpacing = 3.sp))
                      BasicText(SimpleDateFormat("EEEE \u00b7 d MMM", Locale.getDefault()).format(now).uppercase(),
                          style = TextStyle(color = Gold, fontSize = 13.sp, fontFamily = serif, letterSpacing = 4.sp))
                      BasicText("\u201cThere is no place like Vinland.\u201d", Modifier.padding(top = 10.dp),
                          style = TextStyle(color = Cream.copy(alpha = .9f), fontSize = 13.sp, fontFamily = serif, fontStyle = FontStyle.Italic))
                  }
                  Spacer(Modifier.height(28.dp))
                  apps.filter { it !in dock }.take(8).chunked(4).forEach { row ->
                      Row(Modifier.fillMaxWidth().padding(bottom = 14.dp)) {
                          for (i in 0 until 4) Box(Modifier.weight(1f), contentAlignment = Alignment.Center) {
                              row.getOrNull(i)?.let { AppIcon(it, true, open) }
                          }
                      }
                  }
                  Spacer(Modifier.weight(1f))
                  BasicText("\u16a0  swipe up for the sagas  \u16a0", Modifier.align(Alignment.CenterHorizontally).padding(bottom = 10.dp),
                      style = TextStyle(color = Gold.copy(alpha = .8f), fontSize = 11.sp, fontFamily = serif, letterSpacing = 2.sp))
                  Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(30.dp)).background(Color(0x990B1A24))
                      .border(1.dp, Gold.copy(alpha = .35f), RoundedCornerShape(30.dp)).padding(10.dp),
                      horizontalArrangement = Arrangement.SpaceEvenly) {
                      dock.forEach { AppIcon(it, false, open) }
                  }
              }
          }

          @Composable
          fun Drawer(apps: List<AppItem>, open: (AppItem) -> Unit) {
              var q by remember { mutableStateOf("") }
              val shown = remember(q, apps) { apps.filter { it.label.contains(q.trim(), ignoreCase = true) } }
              Column(Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding().padding(horizontal = 16.dp)) {
                  Box(Modifier.padding(vertical = 14.dp).fillMaxWidth().clip(RoundedCornerShape(26.dp))
                      .background(Color(0x66FFFFFF).copy(alpha = .08f)).border(1.dp, Gold.copy(alpha = .5f), RoundedCornerShape(26.dp))
                      .padding(horizontal = 18.dp, vertical = 14.dp)) {
                      if (q.isEmpty()) BasicText("Search the sagas\u2026", style = TextStyle(color = Cream.copy(alpha = .5f), fontSize = 15.sp, fontFamily = FontFamily.Serif))
                      BasicTextField(q, { q = it }, singleLine = true, cursorBrush = SolidColor(Gold),
                          textStyle = TextStyle(color = Cream, fontSize = 15.sp, fontFamily = FontFamily.Serif), modifier = Modifier.fillMaxWidth())
                  }
                  LazyVerticalGrid(GridCells.Fixed(4), verticalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(bottom = 24.dp)) {
                      items(shown, key = { it.pkg + it.cls }) { a -> Box(contentAlignment = Alignment.Center) { AppIcon(a, true, open) } }
                  }
              }
          }

          @Composable
          fun AppIcon(a: AppItem, label: Boolean, open: (AppItem) -> Unit) {
              val hap = LocalHapticFeedback.current
              val shape = RoundedCornerShape(18.dp)
              Column(Modifier.clip(RoundedCornerShape(16.dp)).clickable { hap.performHapticFeedback(HapticFeedbackType.LongPress); open(a) }.padding(4.dp),
                  horizontalAlignment = Alignment.CenterHorizontally) {
                  Box(Modifier.size(60.dp).shadow(8.dp, shape).clip(shape)
                      .background(Brush.linearGradient(listOf(Color(0xFF2B3A42), Color(0xFF0F1A20))))
                      .border(1.2.dp, Gold, shape), contentAlignment = Alignment.Center) {
                      Image(a.icon, a.label, Modifier.size(40.dp).clip(RoundedCornerShape(10.dp)))
                  }
                  if (label) BasicText(a.label, Modifier.width(66.dp).padding(top = 4.dp), maxLines = 1, overflow = TextOverflow.Ellipsis,
                      style = TextStyle(color = Cream, fontSize = 11.sp, fontFamily = FontFamily.Serif, textAlign = TextAlign.Center))
              }
          }
          VIKING_EOF
          mkdir -p $(dirname app/src/main/res/values/themes.xml)
          cat > app/src/main/res/values/themes.xml <<'VIKING_EOF'
          <resources>
              <style name="Theme.Vinland" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          VIKING_EOF
      - name: Build APK
        run: cd $HOME/proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VinlandLauncher-APK
